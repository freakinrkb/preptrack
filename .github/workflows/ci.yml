name: PrepTrack CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: preptrack
          POSTGRES_USER: preptrack
          POSTGRES_PASSWORD: ci-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U preptrack -d preptrack"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify API and authorization isolation
        working-directory: backend
        env:
          PREPTRACK_TEST_DB_URL: jdbc:postgresql://localhost:5432/preptrack
          PREPTRACK_TEST_DB_USER: preptrack
          PREPTRACK_TEST_DB_PASSWORD: ci-password
        run: ./gradlew test
      - name: Build web client
        run: |
          npm ci
          npm run build
