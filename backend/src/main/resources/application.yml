spring:
  application:
    name: preptrack-api
  datasource:
    url: ${PREPTRACK_DB_URL:jdbc:postgresql://localhost:5432/preptrack}
    username: ${PREPTRACK_DB_USER:preptrack}
    password: ${PREPTRACK_DB_PASSWORD:preptrack-local-only}
  session:
    jdbc:
      initialize-schema: always
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${PREPTRACK_COOKIE_SECURE:false}
        same-site: lax
      timeout: 8h
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
