services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: preptrack
      POSTGRES_USER: preptrack
      POSTGRES_PASSWORD: ${PREPTRACK_DB_PASSWORD:?Create deploy/windows/.env.production first}
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=30", "-c", "work_mem=4MB"]
    volumes:
      - preptrack-windows-db:/var/lib/postgresql/data
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U preptrack -d preptrack"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SERVER_ADDRESS: 0.0.0.0
      PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/preptrack
      SPRING_DATASOURCE_USERNAME: preptrack
      SPRING_DATASOURCE_PASSWORD: ${PREPTRACK_DB_PASSWORD:?Create deploy/windows/.env.production first}
      PREPTRACK_INVITE_SECRET: ${PREPTRACK_BOOTSTRAP_SECRET:-}
      PREPTRACK_COOKIE_SECURE: "true"
      PREPTRACK_MEDIA_ROOT: /var/lib/preptrack/media
      PREPTRACK_MEDIA_STAGING_ROOT: /var/lib/preptrack/media/.staging
      PREPTRACK_MEDIA_MAX_FILE_BYTES: ${PREPTRACK_MEDIA_MAX_FILE_BYTES:-8589934592}
      PREPTRACK_MEDIA_RESERVE_BYTES: ${PREPTRACK_MEDIA_RESERVE_BYTES:-10737418240}
      PREPTRACK_MEDIA_MAX_FILE_SIZE: ${PREPTRACK_MEDIA_MAX_FILE_SIZE:-8GB}
      SPRING_SERVLET_MULTIPART_LOCATION: /var/lib/preptrack/media/.staging
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: ${PREPTRACK_MEDIA_MAX_REQUEST_SIZE:-9GB}
      JAVA_TOOL_OPTIONS: -XX:InitialRAMPercentage=20 -XX:MaxRAMPercentage=60 -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError
    mem_limit: 1536m
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/actuator/health/readiness || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    expose:
      - "8080"
    volumes:
      - type: bind
        source: ${PREPTRACK_MEDIA_ROOT:?Run Initialize-PrepTrack.ps1 to configure Windows SSD storage}
        target: /var/lib/preptrack/media

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PREPTRACK_LOCAL_PORT:-8081}:80"
      - "127.0.0.1:${PREPTRACK_PUBLIC_LOCAL_PORT:-8082}:81"
    mem_limit: 128m

volumes:
  preptrack-windows-db:
