services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: preptrack
      POSTGRES_USER: preptrack
      POSTGRES_PASSWORD: ${PREPTRACK_DB_PASSWORD:-preptrack-local-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - preptrack-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U preptrack -d preptrack"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  preptrack-db:
