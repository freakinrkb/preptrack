services:
  - type: web
    name: preptrack-api
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health/readiness
    envVars:
      - key: SERVER_ADDRESS
        value: 0.0.0.0
      - key: PREPTRACK_COOKIE_SECURE
        value: "true"
      - key: PREPTRACK_INVITE_SECRET
        generateValue: true
      - key: PREPTRACK_DB_HOST
        fromDatabase:
          name: preptrack-db
          property: host
      - key: PREPTRACK_DB_PORT
        fromDatabase:
          name: preptrack-db
          property: port
      - key: PREPTRACK_DB_NAME
        fromDatabase:
          name: preptrack-db
          property: database
      - key: PREPTRACK_DB_USER
        fromDatabase:
          name: preptrack-db
          property: user
      - key: PREPTRACK_DB_PASSWORD
        fromDatabase:
          name: preptrack-db
          property: password

databases:
  - name: preptrack-db
    databaseName: preptrack
    user: preptrack
    region: singapore
    plan: 0.1c-256mb
